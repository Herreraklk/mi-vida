<main>
  
  <h1 class="page-title">radio nuestra</h1>
  <p class="page-sub">morat y cornelio, para todo momento.</p>
  <div class="sun-divider">
    <span class="rule"></span>
    <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.2" fill="#f5c563"/><g stroke="#f5c563" stroke-width="1.3"><path d="M12 3.5v3M12 17.5v3M3.5 12h3M17.5 12h3M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2"/></g></svg>
    <span class="rule"></span>
  </div>

  <div class="track-list" id="trackList">
    <div class="track" data-title="Besos en guerra" data-artist="cornelio" data-src="audio/besos.mp3">
      <div class="play-icon"></div>
      <div class="info"><span class="title">15 Besos</span><span class="artist">cornelio</span></div>
    </div>
    <div class="track" data-title="foryu" data-artist="camilo" data-src="audio/foryu.mp3">
      <div class="play-icon"></div>
      <div class="info"><span class="title">For Eva</span><span class="artist">Camilo</span></div>
    </div>
    <div class="track" data-title="amor" data-artist="Emmanuel Cortes" data-src="audio/amor.mp3">
      <div class="play-icon"></div>
      <div class="info"><span class="title">Amor (turuturutrutur)</span><span class="artist">Emmanuel Cortes</span></div>
    </div>
  </div>
  <audio id="player"></audio>
  <div class="radio-note" id="radioNote"></div>
</main>

<footer>hecho con cariño.</footer>

<script src="sky.js"></script>
<script>
  const player = document.getElementById('player');
  const radioNote = document.getElementById('radioNote');
  const defaultNote = radioNote.innerHTML;
  let currentTrack = null;

  function showError(msg){
    radioNote.textContent = msg;
    radioNote.style.color = '#f2637f';
  }

  document.querySelectorAll('.track').forEach(tr=>{
    tr.addEventListener('click', (e)=>{
      e.stopPropagation();
      const src = tr.dataset.src;

      if(currentTrack === tr){
        // pausar/reanudar la misma canción
        if(player.paused){ player.play(); tr.classList.add('playing'); }
        else { player.pause(); tr.classList.remove('playing'); }
        return;
      }

      if(currentTrack) currentTrack.classList.remove('playing');
      player.src = src;
      currentTrack = tr;
      player.play().then(()=>{
        tr.classList.add('playing');
      }).catch(()=>{
        tr.classList.remove('playing');
        showError('no se pudo reproducir "' + tr.dataset.title + '" — revisa el archivo o abre la página con un servidor local (no con doble clic).');
      });
    });
  });

  player.addEventListener('ended', ()=>{
    if(currentTrack) currentTrack.classList.remove('playing');
    currentTrack = null;
  });
</script>
</body>
</html>
